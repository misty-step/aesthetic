name: pages

# Deploys aesthetic.mistystep.io. Run it by hand after the ci workflow passes
# on the same commit. npm run build:site writes _site/: site/, aesthetic.css
# and brand/identity/ with its fonts, marks and icons, and it fails on any
# reference the artifact cannot serve. It needs no installed packages.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run build:site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
