name: brand

# Run focused package and lab checks as the pre-release gate.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity:
    name: Identity package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brand
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: brand/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: identity/ matches the locked tokens and sources
        run: npm run identity:check
      - name: Runtime sources and published declarations type-check
        run: npx tsc -p scripts/identity
      - name: Resolve the published exports and build the package demo
        run: npm run demo

  lab:
    name: Configurator build and smoke gate
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: brand/configurator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: brand/configurator/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Smoke the built identity lab
        run: npm run smoke -- --out evidence
