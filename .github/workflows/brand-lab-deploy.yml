name: brand lab deploy

# Every push to master that touches brand/ deploys the configurator to
# https://misty-brand-lab.misty-step.workers.dev after its build and quick WebGL smoke gate pass.
#
# Queue: one group with cancel-in-progress. A newer run cancels an older in-progress or pending
# one, and every run builds master as it is when the run starts (not the triggering commit), so
# the surviving run always deploys the newest lab. A stale rerun or a dispatch from another
# branch also builds current master. Executed proof of that sequence on a disposable repository:
# https://github.com/moomooskycow/deploy-queue-proof-20261030/actions

on:
  push:
    branches: [master]
    paths: ['brand/**', '.github/workflows/brand-lab-deploy.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brand-lab-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brand/configurator
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - name: Record the revision being built
        id: rev
        run: |
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Building master at $sha (triggered by $GITHUB_SHA)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: brand/configurator/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Quick WebGL smoke gate on the built lab
        run: node scripts/smoke.mjs --webgl --quick --out evidence
      - name: Deploy misty-brand-lab
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: The live lab serves this build
        env:
          BUILT: ${{ steps.rev.outputs.sha }}
        run: |
          want="$(grep -oE '/assets/[^"]+' dist/index.html | sort -u)"
          for i in $(seq 1 12); do
            got="$(curl -fsSL "https://misty-brand-lab.misty-step.workers.dev/?v=$BUILT" | grep -oE '/assets/[^"]+' | sort -u)"
            [ "$got" = "$want" ] && { echo "misty-brand-lab serves master at $BUILT" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
            sleep 10
          done
          echo "misty-brand-lab does not serve master at $BUILT"; exit 1
