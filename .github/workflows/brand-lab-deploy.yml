name: brand lab deploy

# Deploy the locked identity lab after its manual release gate.
# Always build current master so a stale dispatch cannot republish an older lab.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brand-lab-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brand/configurator
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - name: Record the revision being built
        id: rev
        run: |
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Building master at $sha (triggered by $GITHUB_SHA)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: brand/configurator/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Smoke the built identity lab
        run: npm run smoke -- --out evidence
      - name: Deploy misty-brand-lab
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: The live lab serves this build
        env:
          BUILT: ${{ steps.rev.outputs.sha }}
        run: |
          want="$(grep -oE '/assets/[^"]+' dist/index.html | sort -u)"
          for i in $(seq 1 12); do
            got="$(curl -fsSL "https://misty-brand-lab.misty-step.workers.dev/?v=$BUILT" | grep -oE '/assets/[^"]+' | sort -u)"
            [ "$got" = "$want" ] && { echo "misty-brand-lab serves master at $BUILT" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
            sleep 10
          done
          echo "misty-brand-lab does not serve master at $BUILT"; exit 1
