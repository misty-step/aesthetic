<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>aesthetic - fixture - .ae-list-row</title>
    <script>
      try {
        var m = localStorage.getItem('ae-mode');
        if (m === 'dark' || m === 'light') {
          document.documentElement.classList.add(m);
          document.documentElement.style.colorScheme = m;
        }
      } catch (e) {}
    </script>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&display=swap"
    />
    <link rel="stylesheet" href="../../aesthetic.css" />
    <style>
      body {
        max-width: 58rem;
        margin: 3em auto;
        padding: 0 1.5em;
      }
    </style>
  </head>
  <body>
    <svg aria-hidden="true" width="0" height="0" style="position: absolute">
      <symbol id="i-clock" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10" />
        <polyline points="12 6 12 12 16 14" />
      </symbol>
      <symbol id="i-bird" viewBox="0 0 24 24">
        <path d="M16 7h.01" />
        <path d="M3.4 18H12a8 8 0 0 0 8-8V7a4 4 0 0 0-7.28-2.3L2 20" />
        <path d="m20 7 2 .5-2 .5" />
        <path d="M10 18v3" />
        <path d="M14 17.75V21" />
        <path d="M7 18a6 6 0 0 0 3.84-10.61" />
      </symbol>
      <symbol id="i-kanban" viewBox="0 0 24 24">
        <path d="M6 5v11" />
        <path d="M12 5v6" />
        <path d="M18 5v14" />
      </symbol>
      <symbol id="i-activity" viewBox="0 0 24 24">
        <path
          d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"
        />
      </symbol>
      <symbol id="i-radio-tower" viewBox="0 0 24 24">
        <path d="M4.9 16.1C1 12.2 1 5.8 4.9 1.9" />
        <path d="M7.8 13.2a4.5 4.5 0 0 1 0-6.4" />
        <circle cx="12" cy="10" r="2" />
        <path d="M16.2 13.2a4.5 4.5 0 0 0 0-6.4" />
        <path d="M19.1 16.1c3.9-3.9 3.9-10.3 0-14.2" />
        <path d="M12 12v10" />
      </symbol>
      <symbol id="i-circle-x" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10" />
        <path d="m15 9-6 6" />
        <path d="m9 9 6 6" />
      </symbol>
      <symbol id="i-triangle-alert" viewBox="0 0 24 24">
        <path
          d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"
        />
        <path d="M12 9v4" />
        <path d="M12 17h.01" />
      </symbol>
      <symbol id="i-circle-check" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10" />
        <path d="m9 12 2 2 4-4" />
      </symbol>
    </svg>

    <!-- standalone fixture: the incident feed decomposes time, app, type,
         and status into fields instead of "14:43 - canary - probe - down". -->
    <div class="ae-list-rows" data-testid="incident-feed" role="list">
      <a class="ae-list-row ae-row-link" href="#incident-1" role="listitem">
        <span class="ae-list-cell ae-list-time" data-field="time">
          <svg class="ae-icon ae-list-icon" data-lucide="clock">
            <use href="#i-clock" />
          </svg>
          <span class="ae-list-label">time</span>
          <span class="ae-list-value">14:43</span>
        </span>
        <span class="ae-list-cell" data-field="app">
          <span class="ae-app-mark" aria-hidden="true">
            <svg class="ae-icon" data-lucide="bird">
              <use href="#i-bird" />
            </svg>
          </span>
          <span class="ae-list-label">app</span>
          <span class="ae-list-value">canary</span>
        </span>
        <span class="ae-list-cell" data-field="type">
          <svg class="ae-icon ae-list-icon" data-lucide="radio-tower">
            <use href="#i-radio-tower" />
          </svg>
          <span class="ae-list-label">type</span>
          <span class="ae-list-value">probe failure</span>
        </span>
        <span class="ae-list-cell ae-list-status" data-field="status">
          <svg class="ae-icon ae-err" data-lucide="circle-x">
            <use href="#i-circle-x" />
          </svg>
          <span class="ae-list-label">status</span>
          <span class="ae-list-value">down</span>
        </span>
      </a>

      <a class="ae-list-row ae-row-link" href="#incident-2" role="listitem">
        <span class="ae-list-cell ae-list-time" data-field="time">
          <svg class="ae-icon ae-list-icon" data-lucide="clock">
            <use href="#i-clock" />
          </svg>
          <span class="ae-list-label">time</span>
          <span class="ae-list-value">14:51</span>
        </span>
        <span class="ae-list-cell" data-field="app">
          <span class="ae-app-mark" aria-hidden="true">
            <svg class="ae-icon" data-lucide="kanban">
              <use href="#i-kanban" />
            </svg>
          </span>
          <span class="ae-list-label">app</span>
          <span class="ae-list-value">powder</span>
        </span>
        <span class="ae-list-cell" data-field="type">
          <svg class="ae-icon ae-list-icon" data-lucide="activity">
            <use href="#i-activity" />
          </svg>
          <span class="ae-list-label">type</span>
          <span class="ae-list-value">error burst</span>
        </span>
        <span class="ae-list-cell ae-list-status" data-field="status">
          <svg class="ae-icon ae-warn" data-lucide="triangle-alert">
            <use href="#i-triangle-alert" />
          </svg>
          <span class="ae-list-label">status</span>
          <span class="ae-list-value">watching</span>
        </span>
      </a>

      <a class="ae-list-row ae-row-link" href="#incident-3" role="listitem">
        <span class="ae-list-cell ae-list-time" data-field="time">
          <svg class="ae-icon ae-list-icon" data-lucide="clock">
            <use href="#i-clock" />
          </svg>
          <span class="ae-list-label">time</span>
          <span class="ae-list-value">14:58</span>
        </span>
        <span class="ae-list-cell" data-field="app">
          <span class="ae-app-mark" aria-hidden="true">
            <svg class="ae-icon" data-lucide="bird">
              <use href="#i-bird" />
            </svg>
          </span>
          <span class="ae-list-label">app</span>
          <span class="ae-list-value">canary</span>
        </span>
        <span class="ae-list-cell" data-field="type">
          <svg class="ae-icon ae-list-icon" data-lucide="radio-tower">
            <use href="#i-radio-tower" />
          </svg>
          <span class="ae-list-label">type</span>
          <span class="ae-list-value">probe restored</span>
        </span>
        <span class="ae-list-cell ae-list-status" data-field="status">
          <svg class="ae-icon ae-ok" data-lucide="circle-check">
            <use href="#i-circle-check" />
          </svg>
          <span class="ae-list-label">status</span>
          <span class="ae-list-value">resolved</span>
        </span>
      </a>
    </div>
  </body>
</html>
