<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">Overview screen placeholder</title>
  <desc id="desc">A Misty Step style product overview with rail, desk, and fielded rows.</desc>
  <rect width="1280" height="800" fill="#fcfcfc" />
  <rect x="64" y="64" width="1152" height="672" fill="#fcfcfc" stroke="#151515" stroke-width="2" />
