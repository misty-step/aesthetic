<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">Release proof placeholder</title>
  <desc id="desc">A release notes page with dated entries and evidence lines.</desc>
  <rect width="1280" height="800" fill="#fcfcfc" />
  <rect x="160" y="88" width="960" height="624" fill="#fcfcfc" stroke="#151515" stroke-width="2" />
  <text x="220" y="154" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#151515">Release notes</text>
  <line x1="220" y1="208" x2="1060" y2="208" stroke="#e9e9e9" stroke-width="2" />
  <text x="220" y="264" font-family="Arial, sans-serif" font-size="18" fill="#737373">2026-07-05 - v0.1</text>
  <text x="220" y="306" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#151515">Public site launched</text>
  <text x="220" y="356" font-family="Arial, sans-serif" font-size="18" fill="#151515">- Screenshot gallery shows real product states.</text>
  <text x="220" y="398" font-family="Arial, sans-serif" font-size="18" fill="#151515">- GitHub Pages deploy publishes site/ only.</text>
  <circle cx="238" cy="464" r="13" fill="none" stroke="#15714b" stroke-width="4" />
  <path d="m230 464 6 6 12-14" fill="none" stroke="#15714b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <text x="270" y="471" font-family="Arial, sans-serif" font-size="18" fill="#737373">Evidence: CI run, deploy URL, rendered screenshot.</text>
  <line x1="220" y1="532" x2="1060" y2="532" stroke="#e9e9e9" stroke-width="2" />
  <text x="220" y="588" font-family="Arial, sans-serif" font-size="18" fill="#737373">YYYY-MM-DD - next</text>
  <text x="220" y="630" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#151515">Next user-facing change</text>
</svg>
